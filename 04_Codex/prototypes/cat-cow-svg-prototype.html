<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moovka – prototyp animace Kočka–kráva</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #17304d;
      --muted: #6f7f8e;
      --coral: #ef6f75;
      --coral-dark: #d85c66;
      --leggings: #303943;
      --skin: #d9a17e;
      --skin-shadow: #c88968;
      --hair: #694538;
      --mat: #bee8e2;
      --mat-edge: #9fd8d0;
      --line: #283a4b;
      --studio: #f7faf9;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(14px, 4vw, 36px);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(190, 232, 226, .28), transparent 30%),
        linear-gradient(180deg, #fbfdfc 0%, #f2f7f5 100%);
      color: var(--navy);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .prototype {
      width: min(100%, 920px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #198d89;
      font-size: clamp(.72rem, 2.7vw, .82rem);
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 6vw, 2.45rem);
      line-height: 1.1;
      letter-spacing: -.03em;
    }

    .stage {
      min-height: 1.5em;
      margin: 9px 0 13px;
      color: var(--muted);
      font-size: clamp(.88rem, 3.5vw, 1rem);
    }

    .scene {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: clamp(20px, 5vw, 34px);
      background: var(--studio);
      box-shadow: 0 22px 60px rgba(31, 73, 85, .12);
      isolation: isolate;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 10;
    }

    .outline {
      stroke: var(--line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .limb-shadow {
      fill: none;
      stroke: rgba(26, 44, 57, .12);
      stroke-width: 31;
      stroke-linecap: round;
    }

    .skin-limb {
      fill: none;
      stroke: var(--skin);
      stroke-width: 27;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .legging-limb {
      fill: none;
      stroke: var(--leggings);
      stroke-width: 31;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .joint {
      fill: var(--skin);
      stroke: var(--line);
      stroke-width: 3.5;
    }

    .legging-joint {
      fill: var(--leggings);
      stroke: var(--line);
      stroke-width: 3.5;
    }

    .ground-shadow {
      filter: blur(8px);
      opacity: .14;
    }

    .breath-ring {
      fill: none;
      stroke: rgba(35, 157, 150, .35);
      stroke-width: 3;
      transform-origin: center;
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 50%, 100% { opacity: .25; transform: scale(.94); }
      25%, 75% { opacity: .7; transform: scale(1.04); }
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(.78rem, 3vw, .9rem);
    }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .scene { border-radius: 22px; }
      svg { aspect-ratio: 4 / 3; }
    }

    @media (prefers-reduced-motion: reduce) {
      .breath-ring { animation: none; }
    }
  </style>
</head>
<body>
  <main class="prototype">
    <p class="eyebrow">Plynulá mobilita páteře</p>
    <h1>Kočka–kráva</h1>
    <p class="stage" id="stageLabel" aria-live="polite">Neutrální poloha</p>

    <div class="scene">
      <svg viewBox="0 0 900 560" role="img" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Animace cviku Kočka–kráva</title>
        <desc id="svgDesc">Kreslená ženská postava přechází na podložce plynule z neutrální polohy přes krávu a kočku zpět do neutrální polohy.</desc>

        <defs>
          <linearGradient id="wallLight" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#eef5f3"/>
          </linearGradient>
          <linearGradient id="matLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#caeee9"/>
            <stop offset="1" stop-color="#acdeda"/>
          </linearGradient>
          <linearGradient id="coralLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f47d81"/>
            <stop offset="1" stop-color="#e7646d"/>
          </linearGradient>
        </defs>

        <rect width="900" height="560" fill="url(#wallLight)"/>
        <circle class="breath-ring" cx="448" cy="265" r="134"/>
        <path d="M0 418 C210 392 650 402 900 372 L900 560 L0 560 Z" fill="#edf2ee"/>
        <ellipse class="ground-shadow" cx="450" cy="449" rx="320" ry="29" fill="#33444e"/>
        <path d="M120 402 L745 402 Q770 402 780 424 L741 470 L116 470 Q97 468 102 448 Z" fill="url(#matLight)" stroke="var(--mat-edge)" stroke-width="4"/>
        <path d="M117 456 L741 456" fill="none" stroke="rgba(55,139,134,.18)" stroke-width="3"/>

        <g id="figure">
          <!-- back leg stays grounded at the knee and top of the foot -->
          <path id="backThighShadow" class="limb-shadow" d="M522 278 Q516 340 488 392"/>
          <path id="backThigh" class="legging-limb" d="M522 278 Q516 340 488 392"/>
          <path class="skin-limb" d="M488 393 Q527 413 572 420"/>
          <ellipse class="legging-joint" cx="488" cy="392" rx="23" ry="17"/>
          <path d="M558 408 Q584 410 603 423 Q583 441 548 434 Z" fill="var(--skin)" class="outline"/>

          <!-- front leg -->
          <path id="frontThighShadow" class="limb-shadow" d="M490 274 Q470 334 444 392"/>
          <path id="frontThigh" class="legging-limb" d="M490 274 Q470 334 444 392"/>
          <path class="skin-limb" d="M444 393 Q471 416 513 422"/>
          <ellipse class="legging-joint" cx="444" cy="392" rx="23" ry="17"/>
          <path d="M500 410 Q527 412 546 425 Q526 442 491 434 Z" fill="var(--skin)" class="outline"/>

          <!-- arms keep palms fixed -->
          <path id="backArmShadow" class="limb-shadow" d="M324 265 Q305 326 278 405"/>
          <path id="backArm" class="skin-limb" d="M324 265 Q305 326 278 405"/>
          <circle class="joint" cx="302" cy="329" r="14"/>
          <path d="M251 403 Q277 397 304 407 Q294 424 257 424 Q244 418 251 403 Z" fill="var(--skin)" class="outline"/>

          <path id="frontArmShadow" class="limb-shadow" d="M294 258 Q270 323 228 405"/>
          <path id="frontArm" class="skin-limb" d="M294 258 Q270 323 228 405"/>
          <circle class="joint" cx="265" cy="329" r="14"/>
          <path d="M200 403 Q226 397 255 407 Q244 424 207 424 Q194 418 200 403 Z" fill="var(--skin)" class="outline"/>

          <!-- hips and torso are redrawn every frame to follow the spine -->
          <path id="pelvis" d="M468 245 Q510 234 542 257 L535 302 Q499 314 463 289 Z" fill="var(--leggings)" class="outline"/>
          <path id="torso" d="M300 236 C355 222 423 228 485 244 C499 259 498 279 482 292 C412 275 350 272 297 282 C281 269 283 249 300 236 Z" fill="url(#coralLight)" class="outline"/>
          <path id="spineLine" d="M305 255 Q395 246 493 269" fill="none" stroke="rgba(41,54,64,.48)" stroke-width="5" stroke-linecap="round"/>
          <path id="waistLine" d="M468 246 Q485 266 472 292" fill="none" stroke="var(--coral-dark)" stroke-width="4" stroke-linecap="round"/>

          <!-- neck and head -->
          <g id="headGroup" transform="translate(283 226) rotate(5)">
            <path d="M13 16 Q-2 19 -11 32" fill="none" stroke="var(--skin)" stroke-width="19" stroke-linecap="round"/>
            <ellipse cx="0" cy="-3" rx="35" ry="42" fill="var(--skin)" class="outline"/>
            <path d="M-29 -12 Q-19 -48 16 -42 Q46 -33 32 4 Q20 -20 -9 -22 Q-26 -20 -29 -12 Z" fill="var(--hair)" class="outline"/>
            <path d="M27 -26 Q54 -20 63 5 Q46 0 30 -5" fill="var(--hair)" class="outline"/>
            <circle cx="64" cy="6" r="12" fill="var(--hair)" class="outline"/>
            <path d="M-24 2 Q-29 8 -24 13" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
            <path d="M-15 -4 L-7 -5" fill="none" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
            <path d="M-19 18 Q-10 23 -2 17" fill="none" stroke="var(--coral-dark)" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>

        <g fill="var(--muted)" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600">
          <text x="165" y="505">Dlaně zůstávají na místě</text>
          <text x="510" y="505">Kolena zůstávají na místě</text>
        </g>
      </svg>
    </div>
    <p class="hint">Pohyb vede páteř, hlava a pánev jej plynule následují.</p>
  </main>

  <script>
    (() => {
      const torso = document.getElementById('torso');
      const spine = document.getElementById('spineLine');
      const waist = document.getElementById('waistLine');
      const pelvis = document.getElementById('pelvis');
      const head = document.getElementById('headGroup');
      const frontArm = document.getElementById('frontArm');
      const backArm = document.getElementById('backArm');
      const frontArmShadow = document.getElementById('frontArmShadow');
      const backArmShadow = document.getElementById('backArmShadow');
      const frontThigh = document.getElementById('frontThigh');
      const backThigh = document.getElementById('backThigh');
      const frontThighShadow = document.getElementById('frontThighShadow');
      const backThighShadow = document.getElementById('backThighShadow');
      const stageLabel = document.getElementById('stageLabel');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const duration = 12000;
      let startTime = performance.now();
      let lastStage = '';

      const fixed = value => Number(value).toFixed(1);

      function stageFor(phase) {
        if (phase < .08 || phase > .92 || (phase > .42 && phase < .58)) return 'Neutrální poloha';
        if (phase < .42) return 'Kráva · otevřený hrudník';
        return 'Kočka · zakulacená páteř';
      }

      function draw(bend) {
        // bend: +1 = cow, -1 = cat
        const shoulderY = 254 + bend * 8;
        const hipY = 266 - bend * 10;
        const spineControlY = 248 + bend * 58;
        const upperControlY = spineControlY - 22;
        const lowerControlY = spineControlY + 24;

        torso.setAttribute('d', [
          `M300 ${fixed(shoulderY - 19)}`,
          `Q392 ${fixed(upperControlY)} 485 ${fixed(hipY - 23)}`,
          `Q505 ${fixed(hipY - 2)} 482 ${fixed(hipY + 24)}`,
          `Q392 ${fixed(lowerControlY)} 297 ${fixed(shoulderY + 27)}`,
          `Q278 ${fixed(shoulderY + 5)} 300 ${fixed(shoulderY - 19)} Z`
        ].join(' '));

        spine.setAttribute('d', `M305 ${fixed(shoulderY + 1)} Q395 ${fixed(spineControlY)} 493 ${fixed(hipY + 2)}`);
        waist.setAttribute('d', `M468 ${fixed(hipY - 21)} Q490 ${fixed(hipY + 1)} 472 ${fixed(hipY + 24)}`);
        pelvis.setAttribute('d', `M468 ${fixed(hipY - 23)} Q510 ${fixed(hipY - 34)} 542 ${fixed(hipY - 10)} L535 ${fixed(hipY + 35)} Q499 ${fixed(hipY + 47)} 463 ${fixed(hipY + 22)} Z`);

        const shoulderBack = `M324 ${fixed(shoulderY + 10)} Q305 326 278 405`;
        const shoulderFront = `M294 ${fixed(shoulderY + 3)} Q270 323 228 405`;
        backArm.setAttribute('d', shoulderBack);
        backArmShadow.setAttribute('d', shoulderBack);
        frontArm.setAttribute('d', shoulderFront);
        frontArmShadow.setAttribute('d', shoulderFront);

        const hipBack = `M522 ${fixed(hipY + 12)} Q516 340 488 392`;
        const hipFront = `M490 ${fixed(hipY + 8)} Q470 334 444 392`;
        backThigh.setAttribute('d', hipBack);
        backThighShadow.setAttribute('d', hipBack);
        frontThigh.setAttribute('d', hipFront);
        frontThighShadow.setAttribute('d', hipFront);

        const headX = 283 - bend * 5;
        const headY = 226 + bend * 2;
        const headAngle = 7 - bend * 24;
        head.setAttribute('transform', `translate(${fixed(headX)} ${fixed(headY)}) rotate(${fixed(headAngle)})`);
      }

      function frame(now) {
        if (reduceMotion.matches) {
          draw(0);
          stageLabel.textContent = 'Neutrální poloha · animace je omezena v nastavení systému';
          return;
        }

        const phase = ((now - startTime) % duration) / duration;
        const bend = Math.sin(phase * Math.PI * 2);
        draw(bend);

        const currentStage = stageFor(phase);
        if (currentStage !== lastStage) {
          stageLabel.textContent = currentStage;
          lastStage = currentStage;
        }
        requestAnimationFrame(frame);
      }

      reduceMotion.addEventListener?.('change', () => {
        startTime = performance.now();
        requestAnimationFrame(frame);
      });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
