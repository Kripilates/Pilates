name: Deploy Moovka to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pages-requirements.txt

      - name: Install image dependency
        run: python -m pip install --requirement tools/pages-requirements.txt

      - name: Restore generated thumbnail cache
        uses: actions/cache@v4
        with:
          path: .cache/library-thumbnails
          key: moovka-library-thumbnails-${{ runner.os }}-${{ hashFiles('Pilates Assets/02_Exercise_Cards/**/*.png', 'app.js', 'data.js', 'tools/generate_library_thumbnails.py') }}
          restore-keys: |
            moovka-library-thumbnails-${{ runner.os }}-

      - name: Build Pages artifact
        run: python tools/build_pages.py --deployment-id "${GITHUB_SHA}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
