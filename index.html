<nav><button id="nav-home" class="active"><span>⌂</span>Domů</button><button id="nav-days"><span>☑</span>Plán</button><button id="nav-calendar"><span>▦</span>Kalendář</button><button id="nav-library"><span>☰</span>Moje Moovka</button><button id="nav-favs">♡ Oblíbené</button><button id="nav-stats">↗ Můj pokrok</button><button id="nav-progress">◎ Měření</button><button id="nav-dark">🌙</button></nav>
<main id="app"><section class="card"><h2>Načítám aplikaci…</h2><p class="muted">Aplikaci se nepodařilo načíst. Zkus stránku obnovit.</p></section></main>
<script>
// v54: odstraňuje jen service workery a cache patřící této Pilates aplikaci.
(function(){
  try {
    var appPath = location.origin + location.pathname.replace(/\/[^\/]*$/, '/');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(reg){
          if (reg.scope && reg.scope.indexOf(appPath) === 0) reg.unregister();
        });
      }).catch(function(){});
    }
    if ('caches' in window) {
      caches.keys().then(function(keys){
        keys.forEach(function(key){
          if (/^(PB40|pb40|pilates)/i.test(key)) caches.delete(key);
        });
      }).catch(function(){});
    }
  } catch(e) {}
})();
</script>
<script src="data.js?v=local-dev"></script>
<script src="app.js?v=local-dev"></script>
</body>
